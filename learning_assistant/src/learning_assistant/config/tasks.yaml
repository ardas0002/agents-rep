plan_learning_path:
  description: >
    Today's date is {today_date}.

    The user wants to learn about: {topic}
    Available time: {time_available}

    IMPORTANT: Your FIRST action must be to use the "Search Learned Concepts" tool
    to check what concepts the user has already mastered in "{topic}"!

    Your job is to:
    1. USE THE TOOL to search for learned concepts in "{topic}" - DO THIS FIRST!
    2. Analyze which concepts the user already knows
    3. Identify the NEXT logical concepts that build upon existing knowledge
    4. Create a lesson plan for {time_available} covering these new concepts
    5. List specific concepts that will be taught in this session

    CONCEPT PROGRESSION RULES:
    - If user has NO concepts learned: Start with foundational/basic concepts
    - If user has basic concepts: Move to intermediate concepts that require those basics
    - If user has intermediate concepts: Advance to complex/advanced topics
    - NEVER repeat concepts the user already knows
    - Each new concept should build on previously learned ones

    Example progression for SQL:
    - New user: SELECT, WHERE, ORDER BY (basics)
    - After basics: JOINs, GROUP BY, HAVING (intermediate)
    - After intermediate: Subqueries, CTEs, Window functions (advanced)

  expected_output: >
    A structured lesson plan containing:
    - CONCEPTS TO TEACH: List of 2-4 specific concepts for this session (REQUIRED)
    - Prerequisites: What concepts user already knows (from tool search)
    - Learning objectives: What user will be able to do after this lesson
    - Main sections: 3-4 sections covering the new concepts
    - Concept dependencies: How new concepts build on existing knowledge
    - Next concepts: What should come in future sessions
  agent: curriculum_planner

create_lesson_content:
  description: >
    Based on the lesson plan provided, create comprehensive lesson notes
    for learning about {topic}.

    Today's date is {today_date} - search for current, up-to-date information.

    Focus on teaching the SPECIFIC CONCEPTS listed in the lesson plan.
    Build explanations assuming the user already knows the prerequisite concepts.

    Your content should include:
    1. Introduction - why these concepts matter, real-world applications
    2. Core concepts - clear explanations for EACH concept from the plan
    3. Practical examples - working code snippets demonstrating each concept
    4. Common pitfalls - mistakes to avoid for each concept
    5. Best practices - industry-standard approaches
    6. Quick reference - summary of key points for each concept

    Target length: Content suitable for {time_available} of focused study.
    Format: Use clear headings (## for each concept), bullet points, and code blocks.
    Tone: Professional but approachable, like explaining to a colleague.

  expected_output: >
    A complete lesson document in Markdown format with:
    - Clear section headings (## for each concept being taught)
    - Well-formatted code examples with syntax highlighting
    - Bullet points for key concepts
    - Callout boxes for important notes/warnings
    - Approximately 1500-2500 words of content

    IMPORTANT: At the END of the lesson, include a section:
    ## Concepts Learned
    - Concept 1: Brief description
    - Concept 2: Brief description
    (This list will be used to track learning progress)
  agent: content_creator
  context: [plan_learning_path]

generate_exercises:
  description: >
    Based on the lesson content about {topic}, create practical exercises
    that reinforce the key concepts.

    Create 3-5 exercises with progressive difficulty:
    1. EASY (Warm-up): Simple task to verify basic understanding
    2. MEDIUM (Practice): Apply concepts in a realistic scenario
    3. MEDIUM-HARD (Challenge): Combine multiple concepts
    4. HARD (Bonus - optional): Edge cases or advanced application

    For each exercise include:
    - Clear problem statement
    - Input/output examples where applicable
    - Starter code or template (if helpful)
    - Hints (hidden/toggleable)
    - Success criteria - how to know you've solved it correctly

    Exercises should be completable within the remaining time of {time_available}.

    IMPORTANT: At the very END of your output, you MUST include a summary section
    listing all concepts that were taught in this session.
  expected_output: >
    A set of 3-5 exercises in Markdown format:
    - Each exercise clearly numbered and labeled with difficulty
    - Problem statements that are unambiguous
    - Code templates where appropriate
    - Hints section for each exercise
    - Expected output or success criteria

    REQUIRED at the end:
    ## Concepts Learned
    - Concept 1: Brief description of what was taught
    - Concept 2: Brief description of what was taught
    (List ALL concepts from the lesson plan that were covered)
  agent: exercise_generator
  context: [create_lesson_content]
